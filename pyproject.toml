[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
license-files = []  # https://github.com/astral-sh/uv/issues/9513

[tool.setuptools.packages]
find = { include = ["ruck*"] }

[tool.setuptools_scm]
fallback_version = "0.0.0" # error

[project]
name = "ruck"
dynamic = ["version"]  # Version is managed by setuptools_scm
description = "Performant evolutionary algorithms for Python."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Nathan Juraj Michlo", email = "NathanJMichlo@gmail.com" }]
urls = { Homepage = "https://github.com/nmichlo/ruck" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
]

dependencies = [
    "numpy>=1.19",
    "tqdm>=4",
]

[project.optional-dependencies]

test = [
    "pytest>=8",
    "pytest-cov>=5",
]

# optional, for performance improvements
jit = [
    "numba>=0.40.0",
]

# needed by the examples under `examples/`
examples = [
    "ray>=1.6.0",
    "deap>=1.3",
    "matplotlib>=3",
]


# ========================================================================= #
# RUFF                                                                      #
# ========================================================================= #

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# `E4/E7/E9 + F` is the ruff default, `I` adds import sorting (previously isort).
# `UP` modernises syntax for the python floor, including PEP 695 generics.
# `TID251` enforces the banned-api list below.
# `B009`/`B010` ban `getattr(x, "const")` / `setattr(x, "const", v)` -- write `x.const`.
select = ["E4", "E7", "E9", "F", "I", "UP", "TID251", "B009", "B010"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Any disables type checking wherever it appears. Use a precise type, a TypeVar, a Protocol, or a dedicated sentinel class."
"typing.cast".msg = "cast asserts a type the checker cannot verify. Narrow with isinstance/assert, or fix the annotation."

[tool.ruff.lint.isort]
# previously `isort --profile=black --force-single-line-imports`
force-single-line = true

[tool.ruff.lint.per-file-ignores]
# `__init__.py` files are re-export hubs -- unsorted, star and "unused" imports
# are the point.
"**/__init__.py" = ["F401", "F403", "I001"]
# the examples demonstrate the `from ruck import *` entry point on purpose
"examples/**" = ["F403", "F405"]


# ========================================================================= #
# TY                                                                        #
# ========================================================================= #

# ty runs as a pre-commit hook and gates CI. it needs the dependencies
# resolvable and auto-detects `.venv`, so create one first:
#     uv venv --python 3.12 .venv && uv pip install --python .venv -e ".[jit,examples,test]"

[tool.ty.environment]
python-version = "3.12"


# ========================================================================= #
# PYTEST                                                                    #
# ========================================================================= #

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "ruck"]
python_files = ["test_*.py", "__test__*.py"]
# `tests/test_ruck.py` imports the top-level `examples` package. the `pytest`
# console script does not put the repo root on `sys.path`, so without this the
# whole suite aborts during collection. better than mutating sys.path in a conftest.
pythonpath = ["."]
