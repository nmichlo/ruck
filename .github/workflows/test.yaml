name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # one job only: `test_nsga2.py` needs deap and `test_ruck.py` needs ray, both from
  # the `examples` extra, and ruck has no marker convention to split them out. a
  # base-deps job would have nothing left to run.
  test:
    uses: nmichlo/.github/.github/workflows/pytest.yaml@main
    with:
      python-versions: '["3.12", "3.13"]'
      install-extras: "jit,examples,test"
      pytest-args: "--color=yes --verbose"
